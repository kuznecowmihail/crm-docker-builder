<div class="project-workspace">
  <div class="workspace-header">
    <div class="workspace-header-main">
      <h2>Рабочее пространство</h2>
      <div class="project-info" *ngIf="projectConfig">
        <span class="project-chip"><mat-icon>label</mat-icon>{{ projectConfig.projectName }}</span>
        <span class="project-chip project-chip-path" [matTooltip]="projectConfig.projectPath"><mat-icon>folder</mat-icon>{{ projectConfig.projectPath }}</span>
      </div>
    </div>
    <button mat-stroked-button class="exit-button" (click)="onExitProject()" matTooltip="Закрыть проект">
      <mat-icon>logout</mat-icon>
      Закрыть
    </button>
  </div>
  
  <div class="workspace-content">
    <div class="workspace-sidebar">
      <h3>Навигация</h3>
      <mat-accordion class="project-navigation" hideToggle>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>home</mat-icon>
              Общие настройки
            </mat-panel-title>
          </mat-expansion-panel-header>
            <div class="panel-content">
              <button mat-button [class.active]="activeSection === 'general'" (click)="onSectionSelect('general')">
                <mat-icon>info</mat-icon>
                Проект
              </button>
            </div>
        </mat-expansion-panel>
        
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>folder</mat-icon>
              Базы данных
            </mat-panel-title>
          </mat-expansion-panel-header>
            <div class="panel-content">
              <button mat-button [class.active]="activeSection === 'postgres'" (click)="onSectionSelect('postgres')">
                <mat-icon>storage</mat-icon>
                Postgres
              </button>
              <button mat-button [class.active]="activeSection === 'pgadmin'" (click)="onSectionSelect('pgadmin')">
                <mat-icon>admin_panel_settings</mat-icon>
                PgAdmin
              </button>
              <button mat-button [class.active]="activeSection === 'redis'" (click)="onSectionSelect('redis')" class="redis-button">
                <mat-icon>memory</mat-icon>
                Redis
              </button>
              <button mat-button [class.active]="activeSection === 'rabbitmq'" (click)="onSectionSelect('rabbitmq')" class="rabbitmq-button">
                <mat-icon>queue</mat-icon>
                RabbitMQ
              </button>
            </div>
        </mat-expansion-panel>
        
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>apps</mat-icon>
              Crm
            </mat-panel-title>
          </mat-expansion-panel-header>
          <div class="panel-content">
            <div class="crm-nav-item" *ngFor="let crm of projectConfig?.crmConfigs">
              <button mat-button class="crm-nav-button"
                      [class.active]="activeSection === 'crm' && selectedCrmConfig?.id === crm.id"
                      (click)="onSectionSelect('crm', crm)">
                <mat-icon>business</mat-icon>
                <span class="crm-nav-label">{{ crm.containerName || 'Новая CRM' }}</span>
              </button>
              <button mat-icon-button class="crm-nav-delete"
                      matTooltip="Удалить CRM"
                      (click)="onCrmDelete(crm, $event)">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </div>
            <button mat-button class="crm-nav-add" (click)="onCrmAdd()">
              <mat-icon>add</mat-icon>
              Добавить CRM
            </button>
          </div>
        </mat-expansion-panel>
        
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              <mat-icon>build</mat-icon>
              Действия
            </mat-panel-title>
          </mat-expansion-panel-header>
          <div class="panel-content">
            <button mat-button (click)="onBuildProject()">
              <mat-icon>build</mat-icon>
              Собрать
            </button>
            <button mat-button (click)="onRunProject()">
              <mat-icon>play_arrow</mat-icon>
              Запустить
            </button>
          </div>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
    
    <div class="workspace-main">
      <div class="main-content">
        <!-- Общие настройки проекта -->
        <app-general-project-settings 
          *ngIf="activeSection === 'general'"
          [projectConfig]="projectConfig">
        </app-general-project-settings>
        
        <!-- Настройки PostgreSQL -->
        <app-postgres-settings 
          *ngIf="activeSection === 'postgres'"
          [projectConfig]="projectConfig">
        </app-postgres-settings>
        
        <!-- Настройки pgAdmin -->
        <app-pgadmin-settings 
          *ngIf="activeSection === 'pgadmin'"
          [projectConfig]="projectConfig">
        </app-pgadmin-settings>
        
        <!-- Настройки Redis -->
        <app-redis-settings 
          *ngIf="activeSection === 'redis'"
          [projectConfig]="projectConfig">
        </app-redis-settings>
        
        <!-- Настройки RabbitMQ -->
        <app-rabbitmq-settings 
          *ngIf="activeSection === 'rabbitmq'"
          [projectConfig]="projectConfig">
        </app-rabbitmq-settings>
        
        <!-- Настройки CRM -->
        <app-crm-settings 
          *ngIf="activeSection === 'crm'"
          [projectConfig]="projectConfig"
          [crmConfig]="selectedCrmConfig">
        </app-crm-settings>

        <!-- Логи проекта -->
        <app-project-logs 
          *ngIf="activeSection === 'logs'"
          [logs]="projectLogs"
          [maxLogs]="200"
          (clearLogsEvent)="onClearLogs()">
        </app-project-logs>
        
        <!-- Заглушка для других секций -->
        <div class="section-placeholder" *ngIf="!activeSection">
          <mat-card class="placeholder-card">
            <mat-card-content>
              <div class="placeholder-content">
                <mat-icon class="placeholder-icon">dashboard</mat-icon>
                <h3>Выберите раздел</h3>
                <p>Выберите раздел в боковой панели для начала работы</p>
              </div>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
